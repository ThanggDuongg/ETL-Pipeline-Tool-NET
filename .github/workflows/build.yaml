name: Build & Test ETLPipeline Tool

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Ensure LF line endings
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install CSharpier
        run: dotnet tool install -g csharpier

      - name: Add dotnet tools to PATH
        run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Convert line endings to LF
        run: |
          find . -name "*.cs" -type f -exec sed -i 's/\r$//' {} \;

      - name: Check code formatting with CSharpier
        run: |
          find . -name "*.cs" -not -path "./ETLPipelineTool.IntegrationTest/*" -type f > files_to_check.txt
          if [ -s files_to_check.txt ]; then
            cat files_to_check.txt | xargs dotnet csharpier --check
          fi

      - name: Restore dependencies
        run: dotnet restore ETLPipelineTool/ETLPipelineTool.sln

      - name: Build
        run: dotnet build ETLPipelineTool/ETLPipelineTool.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ETLPipelineTool/ETLPipelineTool.sln --no-build --verbosity normal --configuration Release

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/etlpipeline

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure (via email, Slack, etc.)
        run: echo "Build or test failed. Send notification here."
        # TODO sendgrid
